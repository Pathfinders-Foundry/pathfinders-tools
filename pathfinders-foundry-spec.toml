# Pathfinders Foundry Spec — valores canónicos para todos los proyectos
# Fuente de verdad para Daisuke (implementación en source) y Shuri (verificación en build).
# El año de copyright es dinámico — se toma del año de release del proyecto.

[metadata]
# Versión de esta spec. Incrementar cuando cambie un valor canónico.
version = "1.1.0"  # 1.1.0 (2026-10-12): nameID 7 Trademark obligatorio


# ── FONT INFO — nameIDs ────────────────────────────────────────────────────────

[nameids]

# nameID 0 — Copyright
# El año {year} es el año de release del proyecto (variable, no fija).
copyright_template = "Copyright © {year} 2Faces Design SL. All rights reserved."
copyright_pattern  = '^Copyright © \d{4} 2Faces Design SL\. All rights reserved\.$'

# nameID 7 — Trademark (obligatorio desde 2026-10-12, Octavio)
# {family} = nombre base de la familia, sin cut ni Trial ("Seaspray", no "Seaspray MC").
# El checker exige que {family} sea el comienzo del nombre de familia de la fuente.
trademark_template = "{family} is a trademark of Pathfinders Type."
trademark_pattern  = '^(.+) is a trademark of Pathfinders Type\.$'

# nameID 8 — Manufacturer
manufacturer = "Pathfinders Type Foundry"

# nameID 9 — Designer
designer = "Octavio Pardo"

# nameID 11 — Vendor URL
vendor_url = "www.pathfinders.rocks"

# nameID 13 — License Description
# Aplica tanto a fuentes completas como Trial (mismo EULA).
license_description = "Licensed under the Pathfinders Font Software End-User License Agreement."

# nameID 14 — License URL
license_url = "https://pathfinders.rocks/eula/"


# ── TRIAL — glyph set canónico ─────────────────────────────────────────────────

[trial]
# 69 glyphs canónicos para instancias Trial de todos los proyectos Pathfinders.
# A–Z, a–z, 0–9, fi (U+FB01), fl (U+FB02), space, nbspace, period, comma, hyphen.
# Nota: Tiphares Trial v1 tiene 67 (le faltan fi/fl) — esta es la spec corregida.
glyph_set_unicodes = [
  0x0020,        # space
  0x002C,        # comma
  0x002D,        # hyphen
  0x002E,        # period
  0x0030, 0x0031, 0x0032, 0x0033, 0x0034,  # 0–4
  0x0035, 0x0036, 0x0037, 0x0038, 0x0039,  # 5–9
  0x0041, 0x0042, 0x0043, 0x0044, 0x0045,  # A–E
  0x0046, 0x0047, 0x0048, 0x0049, 0x004A,  # F–J
  0x004B, 0x004C, 0x004D, 0x004E, 0x004F,  # K–O
  0x0050, 0x0051, 0x0052, 0x0053, 0x0054,  # P–T
  0x0055, 0x0056, 0x0057, 0x0058, 0x0059,  # U–Y
  0x005A,        # Z
  0x0061, 0x0062, 0x0063, 0x0064, 0x0065,  # a–e
  0x0066, 0x0067, 0x0068, 0x0069, 0x006A,  # f–j
  0x006B, 0x006C, 0x006D, 0x006E, 0x006F,  # k–o
  0x0070, 0x0071, 0x0072, 0x0073, 0x0074,  # p–t
  0x0075, 0x0076, 0x0077, 0x0078, 0x0079,  # u–y
  0x007A,        # z
  0x00A0,        # nbspace (obligatorio — whitespace_glyphs falla si falta)
  0xFB01,        # fi ligature
  0xFB02,        # fl ligature
]


