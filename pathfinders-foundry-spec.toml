# ── REGLAS DE VERIFICACIÓN ─────────────────────────────────────────────────────

[rules]
# Campos que DEBEN estar presentes en todas las fuentes (full y Trial)
required_nameids = [0, 7, 8, 9, 11, 13, 14]

# Campos cuyo valor debe coincidir exactamente (no por patrón)
exact_match = ["manufacturer", "designer", "vendor_url", "license_description", "license_url"]

# Campos verificados por patrón regex
pattern_match = ["copyright_pattern", "trademark_pattern"]

# ── SEVERIDADES ────────────────────────────────────────────────────────────────
# metadata → FAIL bloqueante (Daisuke implementa, Shuri verifica en Release)
# coverage → WARNING informativo (Octavio decide si el deficit es intencional)
