[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pathfinders-tools"
version = "0.4.0"
description = "Pipeline tools for Pathfinders Foundry"
requires-python = ">=3.11"
dependencies = [
    "fonttools[woff]",
    "brotlicffi",
    "ttfautohint-py",  # lo usa fontmake -a (hinting dentro del build)
    # pathfinders-check-render
    "uharfbuzz",
    "freetype-py",
    "numpy",
]

[project.scripts]
pathfinders-ttf-to-web      = "pathfinders_tools.web:main"
pathfinders-fix-trial-subset = "pathfinders_tools.trial:main"
pathfinders-check-render    = "pathfinders_tools.render:main"
pathfinders-check-win-descent = "pathfinders_tools.windescent:main"
pathfinders-check-hinting   = "pathfinders_tools.hinting:main"
pathfinders-hint-plan       = "pathfinders_tools.hinting:plan_main"

[tool.hatch.build.targets.wheel]
packages = ["src/pathfinders_tools"]
