[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pathfinders-tools"
version = "0.2.0"
description = "Pipeline tools for Pathfinders Foundry"
requires-python = ">=3.11"
dependencies = [
    "fonttools[woff]",
    "brotlicffi",
    "ttfautohint-py",
]

[project.scripts]
pathfinders-fix-hints       = "pathfinders_tools.hints:main"
pathfinders-fix-postprocess = "pathfinders_tools.postprocess:main"
pathfinders-ttf-to-web      = "pathfinders_tools.web:main"
pathfinders-fix-trial-subset = "pathfinders_tools.trial:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pathfinders_tools"]
